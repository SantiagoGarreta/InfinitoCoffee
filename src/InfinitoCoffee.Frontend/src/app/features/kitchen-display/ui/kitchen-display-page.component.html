<section class="kitchen">
  <header class="kitchen__header">
    <div>
      <p class="kitchen__eyebrow">Kitchen Display</p>
      <h1>Cocina en tiempo real</h1>
    </div>

    <app-connection-status
      [state]="connectionState()"
      (retry)="store.retryConnection()" />
  </header>

  @if (store.loading()) {
    <app-loading-state label="Cargando pedidos..." />
  } @else if (store.loadError()) {
    <app-error-message [message]="store.loadError()!" retryLabel="Reintentar carga" (retry)="store.initialize()" />
  } @else if (store.orderCount() === 0) {
    <div class="kitchen__empty">
      <h2>Sin pedidos activos</h2>
      <p>Las nuevas comandas apareceran aqui apenas se creen.</p>
    </div>
  } @else {
    <div class="kitchen__grid">
      <app-kitchen-column
        title="En cola"
        description="Pedidos pendientes de comenzar."
        [orders]="queuedOrders()"
        [activeActionOrderId]="store.activeActionOrderId()"
        [actionErrorOrderId]="store.actionError()?.orderId ?? null"
        [actionErrorMessage]="store.actionError()?.message ?? null"
        (startPreparation)="store.startPreparation($event)"
        (cancelOrder)="store.cancelOrder($event)" />

      <app-kitchen-column
        title="Preparando"
        description="Pedidos actualmente en barra."
        [orders]="preparingOrders()"
        [activeActionOrderId]="store.activeActionOrderId()"
        [actionErrorOrderId]="store.actionError()?.orderId ?? null"
        [actionErrorMessage]="store.actionError()?.message ?? null"
        (markReady)="store.markReady($event)"
        (cancelOrder)="store.cancelOrder($event)" />

      <app-kitchen-column
        title="Listos"
        description="Pedidos que ya pueden entregarse."
        [orders]="readyOrders()"
        [activeActionOrderId]="store.activeActionOrderId()"
        [actionErrorOrderId]="store.actionError()?.orderId ?? null"
        [actionErrorMessage]="store.actionError()?.message ?? null"
        (deliver)="store.deliver($event)"
        (cancelOrder)="store.cancelOrder($event)" />
    </div>
  }
</section>
