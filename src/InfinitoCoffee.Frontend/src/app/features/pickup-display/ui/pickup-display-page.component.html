<section class="screen">
  <header class="screen__header">
    <div>
      <p class="eyebrow">Pickup Display</p>
      <h1>Pedidos para retiro</h1>
    </div>
    <div class="status-card">
      <span>Conexion</span>
      <strong>{{ connectionState() }}</strong>
    </div>
  </header>

  <p class="screen__summary">Pedidos visibles: {{ orderCount() }}</p>

  <ul class="orders">
    @for (order of orders(); track order.id) {
      <li class="order-card">
        <strong>{{ order.orderNumber }}</strong>
        <span>{{ order.status }}</span>
      </li>
    } @empty {
      <li class="order-card order-card--empty">No hay pedidos visibles para pickup.</li>
    }
  </ul>
</section>
