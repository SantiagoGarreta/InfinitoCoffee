<article class="pickup-order" [class.pickup-order--ready]="ready()">
  <span class="pickup-order__status">{{ ready() ? 'Listo para retirar' : 'En preparacion' }}</span>
  <strong class="pickup-order__number">{{ order().orderNumber }}</strong>
  @if (order().items.length > 0) {
    <p class="pickup-order__items">{{ formatItems() }}</p>
  }
</article>
