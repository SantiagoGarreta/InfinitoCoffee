name: Frontend build and tests

on:
  pull_request:
    paths:
      - 'src/InfinitoCoffee.Frontend/**'
      - '.github/workflows/frontend-build-and-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tests:
    name: Build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/InfinitoCoffee.Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/InfinitoCoffee.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

      - name: Build
        run: npm run build